<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container{
        /* Flex property are always applicable on parent. */
        display: flex;

        gap: 40px;

        justify-content: center;
        /* justify-content: space-between; */
        /* justify-content: space-around; */
        /* justify-content: space-evenly; */
        /* justify-content: flex-start; */
        /* justify-content: flex-end; */

        align-items: center;

        /* flex-wrap: wrap; */

        /* flex-direction: column; */
        /* flex-direction: column-reverse; */
        /* flex-direction: row; */
        /* flex-direction: row-reverse; */

        /* flex-flow : direction wrap */
        flex-flow: row wrap;

    }

    /* .box{
        width: 300px;
        height: 300px;
    } */

    #box-1{
        width: 300px;
        height: 300px;
        background-color: red;
        /* order: 3; */

        /* flex-grow: 4; */
        /* flex-shrink: 2; */
    }

    #box-2{
        width: 300px;
        height: 150px;
        background-color: green;
        /* order: 2; */
        /* flex-grow: 0; */
        /* flex-shrink: 0; */
    }

    #box-3{
        width: 300px;
        height: 75px;

        background-color: black;
        /* order: 1; */
        /* flex-grow: 2; */
        /* flex-shrink: 3; */
    }

    .con-1{
        width: 200px;
        height: 200px;
        background-color: red;

        animation: moveBox 7s ease-in-out 2s infinite;

        position: relative;
    }

    @keyframes moveBox{
        0%{
            top: 0px;
            left: 0px;
            transform: rotate(0deg);
            background-color: red;
            border-radius: 10px;
        }
        
        25%{
            top: 300px;
            left: 0px;
            transform: rotate(90deg);
            background-color: blue;
            border-radius: 30px;
        }
        
        50%{
            top: 300px;
            left: 300px;
            transform: rotate(180deg);
            background-color: yellow;
            border-radius: 50px;
        }
        
        75%{
            top: 0px;
            left: 300px;
            transform: rotate(270deg);
            background-color: black;
            border-radius: 70px;
        }
        
        100%{
            top: 0px;
            left: 0px;
            transform: rotate(360deg);
            background-color: green;
            border-radius: 90px;
        }
    }


    .carousel{
        width: 90%;
        height: 550px;
        margin: auto;
        /* border: 2px solid #000000; */
        border-radius: 30px;

        animation: carousel 16s ease-in-out 2s infinite;
    }

    @keyframes carousel {
        0%{
            background-image: url(./assets/1.jpg);
            background-size: cover;
            background-position: center;
        }

        35%{
            background-image: url(./assets/2.jpg);
            background-size: cover;
            background-position: center;
        }

        70%{
            background-image: url(./assets/3.jpg);
            background-size: cover;
            background-position: center;
        }

        100%{
            background-image:url(./assets/4.jpg) ;
            background-size: cover;
            background-position: center;
        }
    }
</style>
<body>
    <div class="container">
        <div class="box" id="box-1"></div>
        <div class="box" id="box-2"></div>
        <div class="box" id="box-3"></div>
    </div>


    <!-- <div class="con-1"></div> -->

    <!-- <div class="carousel"></div> -->
</body>
</html>
