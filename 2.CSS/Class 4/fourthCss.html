<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .content-1{
        background-color: red;
        text-align: center;
        font-weight: bolder;
        font-size: 1.5rem;
    }
    .content-2{
        background-color: green;
        text-align: center;
        font-weight: bolder;
        font-size: 1.5rem;
    }
    .content-3{
        background-color: blue;
        text-align: center;
        font-weight: bolder;
        font-size: 1.5rem;
    }
    .content-4{
        background-color: yellow;
        text-align: center;
        font-weight: bolder;
        font-size: 1.5rem;
    }

    .content-1,.content-2,.content-3,.content-4{
        display: none;
    }

    @media (min-width : 1440px) {
        .content-1{
            display: block;
        }
    }

    @media (min-width:1280px) and (max-width:1439px) {
        .content-2{
            display: block;
        }
    }

    @media (min-width:960px) and (max-width:1279px) {
        .content-3{
            display: block;
        }
    }

    @media (max-width:960px){
        .content-4{
            display: block;
        }
    }

    .new:focus{
        background-color: red;
        height: 40px;
        border-radius: 40px;
    }

    /* li:first-child{
        color: red;
    } */

    li:nth-child(odd){
        background-color: blue;
    }

    .check:checked{
        accent-color: yellow;
    }

    :root{
        --bgcolor--: green;
        --color--: red;
        --border--: 2px solid yellow;
    }

    .box{
        width: 100px;
        height: 100px;
        background-color: var(--bgcolor--);
        border: var(--border--);
    }
</style>
<body>
    <!-- <div class="content-1">Laptop TV SCREEN</div>
    <div class="content-2">13 inch Laptop SCREEN</div>
    <div class="content-3">
        Tablet , Ipad SCREEN
    </div>
    <div class="content-4">
        All the Mobile Phones SCREEN
    </div>
    -->

    <input type="text" class="new">
    <hr>
    <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
        <li>Item 5</li>
    </ul>
    <hr>
    <input type="checkbox" class="check"> Agree to This

    <hr>

    <div class="box"></div>

</body>
</html>
